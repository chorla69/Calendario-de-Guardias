<style>
/* Layout: app de una columna para móvil; cabecera con "de guardia ahora", filtro por persona y tres vistas con barra inferior */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f5f7f9; --fg:#16202b; --muted:#5d6b79; --line:#d9dfe5;
  --accent:#d9480f; --accent-ink:#ffffff; --weekend:#e6eaee;
  --p0:#1c7ed6; --p1:#2b8a3e; --p2:#7048e8; --p3:#e03131; --p4:#c2255c;
  --hN:#e8590c; --hA:#2b8a3e; --hL:#1971c2; --hR:#e0a800;
  --hNbg:#fff0e6; --hAbg:#e9f6ec; --hLbg:#e7f1fb; --hRbg:#fff7d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --surface2:#1f2a35; --fg:#e8edf2; --muted:#93a1ae; --line:#2c3946;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --weekend:#1c2631;
  --p0:#4dabf7; --p1:#51cf66; --p2:#9775fa; --p3:#ff6b6b; --p4:#f06595;
  --hN:#ff922b; --hA:#51cf66; --hL:#4dabf7; --hR:#ffd43b;
  --hNbg:#3a2414; --hAbg:#163322; --hLbg:#14283d; --hRbg:#3a3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface2:#1f2a35; --fg:#e8edf2; --muted:#93a1ae; --line:#2c3946;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --weekend:#1c2631;
  --p0:#4dabf7; --p1:#51cf66; --p2:#9775fa; --p3:#ff6b6b; --p4:#f06595;
  --hN:#ff922b; --hA:#51cf66; --hL:#4dabf7; --hR:#ffd43b;
  --hNbg:#3a2414; --hAbg:#163322; --hLbg:#14283d; --hRbg:#3a3214; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top small{color:var(--muted);font-size:12px}
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pairbig{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px 4px 5px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--display);letter-spacing:.02em}
.chip.big{font-size:17px;padding:6px 14px 6px 6px}.chip.big .dot{width:28px;height:28px;font-size:12px}
.sub{color:var(--muted);font-size:13px}
.next{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next>div{background:var(--surface2);border-radius:10px;padding:10px;min-width:0}
.next b{display:block;font-family:var(--display);font-size:20px;font-weight:600}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px 6px 6px;font:600 14px var(--body);display:flex;align-items:center;gap:6px;cursor:pointer}
.filters button.all{padding:6px 14px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:12px}
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;cursor:pointer;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-bottom:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:62px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer;color:var(--fg);font:inherit}
.day.we{background:var(--weekend)}
.day.empty{visibility:hidden}
.day .n{font-family:var(--display);font-weight:600;font-size:16px;line-height:1;font-variant-numeric:tabular-nums}
.day.today{outline:2px solid var(--accent);outline-offset:-1px}
.day .ppl{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.tag{font-family:var(--display);font-size:11px;font-weight:700;color:#fff;border-radius:4px;width:100%;max-width:34px;text-align:center;line-height:15px}
.day.hol{border-width:2px}
.day.hN{border-color:var(--hN);background:var(--hNbg)}.day.hA{border-color:var(--hA);background:var(--hAbg)}.day.hL{border-color:var(--hL);background:var(--hLbg)}.day.hR{border-color:var(--hR);background:var(--hRbg)}
.day.dim .tag{opacity:.22}
.day.mine{box-shadow:inset 0 -4px 0 var(--sel)}
.day.vac::after{content:"V";position:absolute;top:3px;right:4px;font-size:10px;font-weight:700;color:var(--accent)}
.hlist{display:flex;flex-direction:column;gap:6px}
.hitem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.hbar{width:6px;align-self:stretch;border-radius:3px}
.hitem .d{font-family:var(--display);font-weight:600;font-size:16px;min-width:46px}
.hitem .who{margin-left:auto;display:flex;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:2px solid}
.weeks{display:flex;flex-direction:column;gap:8px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.week.cur{border:2px solid var(--accent)}
.week .num{font-family:var(--display);font-size:13px;color:var(--muted);grid-row:span 2;text-align:center;line-height:1.1;min-width:44px}
.week .num b{display:block;font-size:20px;color:var(--fg)}
.week .pair{display:flex;gap:6px;flex-wrap:wrap}
.week .hs{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;border:1px solid}
.week .when{grid-column:2;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:10px;font:600 14px var(--body);cursor:pointer}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td:first-child,th:first-child{text-align:left}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.card h3{margin:0 0 6px;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.mx td.diag{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:4;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.sheet .x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}
</style>
</head>

function renderCal(){
  const el=document.getElementById("v-cal"), y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1), nd=new Date(y,mo+1,0).getDate(), off=(first.getDay()+6)%7;
  const canPrev=new Date(y,mo,0)>=FIRST, canNext=new Date(y,mo+1,1)<=LAST;
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<off;i++) cells+=`<div class="day empty"></div>`;
  const mh=[];
  for(let d=1;d<=nd;d++){
    const dt=new Date(y,mo,d), s=iso(dt), on=g(s), h=HOL[s], v=vac(s);
    if(h) mh.push(s);
    const cls=["day"]; if(dt.getDay()===0||dt.getDay()===6) cls.push("we"); if(h) cls.push("hol","h"+h[1]);
    if(+dt===+today) cls.push("today"); if(sel>=0){ if(on.includes(sel)) cls.push("mine"); else cls.push("dim"); if(v.includes(sel)) cls.push("vac"); }
    else if(v.length) cls.push("vac");
    cells+=`<button class="${cls.join(" ")}" data-s="${s}" aria-label="${d} de ${MES[mo]}: ${on.map(i=>P[i]).join(" y ")||"sin guardia"}${h?", "+h[0]:""}" ${sel>=0?`style="--sel:${pc(sel)}"`:""}><span class="n">${d}</span><span class="ppl">${on.map(i=>`<span class="tag" style="background:${pc(i)}">${AB[i]}</span>`).join("")}</span></button>`;
  }
  let hl="";
  if(mh.length) hl=`<div class="eyebrow">Festivos de ${MES[mo].toLowerCase()}</div><div class="hlist">${mh.map(s=>{const h=HOL[s];return `<div class="hitem"><span class="hbar" style="background:var(--h${h[1]})"></span><span class="d">${parse(s).getDate()} ${MES[mo].slice(0,3)}</span><span>${h[0]}<br><span class="sub">${HT[h[1]]}</span></span><span class="who">${g(s).map(dot).join("")}</span></div>`}).join("")}</div>`;
  let myc="";
  if(sel>=0){const n=keys.filter(s=>{const d=parse(s);return d.getFullYear()===y&&d.getMonth()===mo&&g(s).includes(sel)}).length; myc=`<div class="sub">${P[sel]}: ${n} día${n!==1?"s":""} de guardia este mes</div>`}
  el.innerHTML=`<div class="monthbar"><button class="iconbtn" id="prev" aria-label="Mes anterior" ${canPrev?"":"disabled"}>‹</button><h2>${MES[mo]} ${y}</h2><button class="iconbtn" id="nextm" aria-label="Mes siguiente" ${canNext?"":"disabled"}>›</button></div>
  ${myc}<div class="cal">${cells}</div>
  <div class="legend">${Object.entries(HT).map(([k,v])=>`<span><i class="sw" style="border-color:var(--h${k});background:var(--h${k}bg)"></i>${v}</span>`).join("")}<span><i class="sw" style="border-color:var(--line);background:var(--weekend)"></i>Fin de semana</span></div>${hl}`;
  el.querySelector("#prev").onclick=()=>{cur=new Date(y,mo-1,1);renderCal()};
  el.querySelector("#nextm").onclick=()=>{cur=new Date(y,mo+1,1);renderCal()};
  el.querySelectorAll(".day[data-s]").forEach(b=>b.onclick=()=>openDay(b.dataset.s));
  let sx=null; const cal=el.querySelector(".cal");
  cal.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  cal.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(dx<-50&&canNext){cur=new Date(y,mo+1,1);renderCal()} else if(dx>50&&canPrev){cur=new Date(y,mo-1,1);renderCal()}});
}
function openDay(s){
  const d=parse(s), on=g(s), h=HOL[s], v=vac(s), sh=document.getElementById("sheet");
  const wd=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()];
  sh.innerHTML=`<button class="iconbtn x" aria-label="Cerrar" id="cls">×</button><div class="eyebrow">${wd} ${d.getDate()} de ${MES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}</div>
  ${h?`<div><span class="badge" style="border-color:var(--h${h[1]});color:var(--fg);background:var(--h${h[1]}bg)">${HT[h[1]]}</span> <b>${h[0]}</b></div>`:""}
  <div class="pairbig">${on.length?on.map(i=>chip(i,true)).join(""):'<span class="sub">Sin guardia registrada</span>'}</div>
  ${v.length?`<div class="sub">De vacaciones: ${v.map(i=>P[i]).join(", ")}</div>`:""}`;
  sh.hidden=false; document.getElementById("cls").onclick=()=>{sh.hidden=true};
}
function renderSem(){
  const el=document.getElementById("v-sem"), tm=monday(today);
  let list=WEEKS.filter(w=>showPast||w.m>=tm);
  if(sel>=0) list=list.filter(w=>w.ppl.some(x=>x[0]===sel));
  const n0=WEEKS.findIndex(w=>+w.m===+parse("2026-10-19"));
  el.innerHTML=`<div class="eyebrow">${sel>=0?"Semanas de guardia de "+P[sel]:"Parejas por semana"} · lunes a domingo</div>
  ${!showPast?`<button class="linkbtn" id="past">Ver también semanas anteriores</button>`:""}
  <div class="weeks">${list.map(w=>{const i=WEEKS.indexOf(w), num=i-n0+1, e=addD(w.m,6);
    return `<div class="week${+w.m===+tm?" cur":""}"><div class="num">${num>0?`sem.<b>${num}</b>`:"<b>·</b>prev."}</div>
    <div class="pair">${w.ppl.map(([p,c])=>`<span class="chip">${dot(p)}${P[p]}${c<5?` <span class="sub">(${c} d)</span>`:""}</span>`).join("")}</div>
    <div class="when">${fmt(w.m)} – ${fmt(e)} ${e.getFullYear()}</div>
    ${w.hs.length?`<div class="hs">${w.hs.map(s=>`<span class="badge" style="border-color:var(--h${HOL[s][1]});background:var(--h${HOL[s][1]}bg)">${parse(s).getDate()}/${parse(s).getMonth()+1} ${HOL[s][0]}</span>`).join("")}</div>`:""}</div>`}).join("")}</div>`;
  const pb=el.querySelector("#past"); if(pb) pb.onclick=()=>{showPast=true;renderSem()};
  const c=el.querySelector(".week.cur"); if(c&&!showPast) {}
}
function renderRes(){
  const el=document.getElementById("v-res");
  const d26=[0,0,0,0,0],d27=[0,0,0,0,0],fh=[0,0,0,0,0],mx=P.map(()=>[0,0,0,0,0]);
  for(const s of keys){const on=g(s), y=+s.slice(0,4); on.forEach(p=>{(y===2026?d26:d27)[p]++; if(HOL[s]) fh[p]++;});}
  for(const w of WEEKS){ if(w.m<parse("2026-10-19")) continue; const ps=w.ppl.filter(x=>x[1]>=4).map(x=>x[0]); if(ps.length===2){mx[ps[0]][ps[1]]++;mx[ps[1]][ps[0]]++;} }
  const tot=P.map((_,i)=>d26[i]+d27[i]), avg=tot.reduce((a,b)=>a+b,0)/5;
  el.innerHTML=`<div class="card"><h3>Días de guardia</h3><table><thead><tr><th></th><th>2026</th><th>2027</th><th>Total</th><th>vs media</th><th>Festivos</th></tr></thead><tbody>
  ${P.map((n,i)=>`<tr><td>${dot(i)} ${n}</td><td>${d26[i]}</td><td>${d27[i]}</td><td><b>${tot[i]}</b></td><td>${(tot[i]-avg>0?"+":"")+(tot[i]-avg).toFixed(1)}</td><td>${fh[i]}</td></tr>`).join("")}</tbody></table>
  <p class="note">2026 cuenta desde el 1 de octubre. Festivos: nacionales, Andalucía, locales de Sevilla y RJ Jefatura.</p></div>
  <div class="card"><h3>Cruces de parejas</h3><table class="mx"><thead><tr><th></th>${AB.map((a,i)=>`<th>${dot(i)}</th>`).join("")}</tr></thead><tbody>
  ${P.map((n,i)=>`<tr><td>${n}</td>${P.map((_,j)=>i===j?`<td class="diag">–</td>`:`<td>${mx[i][j]}</td>`).join("")}</tr>`).join("")}</tbody></table>
  <p class="note">Semanas que coincide cada pareja de guardia desde el 19/10/2026.</p></div>
  <div class="card"><h3>Reglas de la rotación</h3><p class="note" style="font-size:14px;color:var(--fg)">2 personas por semana, de lunes a domingo. Nadie hace dos semanas seguidas de guardia ni descansa más de dos seguidas. El festivo lo cubre la pareja de esa semana.</p></div>`;
}
function renderAll(){renderFilters();renderNow();renderCal();renderSem();renderRes()}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["cal","sem","res"].forEach(v=>document.getElementById("v-"+v).hidden=v!==view);
  document.getElementById("sheet").hidden=true; window.scrollTo(0,0)});
const hv=(location.hash||"").slice(1); if(["sem","res"].includes(hv)) document.querySelector(`nav.tabs button[data-v="${hv}"]`)?.click();
renderAll();
</script>
